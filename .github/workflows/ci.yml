name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # the notebook group (Jupyter) is not needed to lint and test
      - run: uv sync --no-group notebook
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # includes tests/test_notebook.py: valid nbformat, no outputs, no execution counts
      - run: uv run pytest -q

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # the model tests read ../examples
      - run: npm test
      - run: npm run build
